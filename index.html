<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poketiba — Shinydex Kanto</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #0f172a, #020617);
      color: #e5e7eb;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 1.5rem;
    }

    header h1 {
      font-size: 2.2rem;
    }

    header p {
      opacity: 0.8;
    }

    #pokemonGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .card {
      background: #020617;
      border-radius: 14px;
      padding: 14px 10px 10px;
      text-align: center;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(56,189,248,0.35);
    }

    .card img {
      width: 96px;
    }

    .card strong {
      display: block;
      margin-top: 6px;
    }

    .slot {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      background: gold;
      color: #020617;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .mega {
      border: 2px solid #38bdf8;
    }
  </style>
</head>

<body>

<header>
  <h1>Poketiba</h1>
  <p>Shinydex da Região de Kanto</p>
</header>

<main id="pokemonGrid"></main>

<script>
  const grid = document.getElementById("pokemonGrid");

  /* LISTA DE MEGAS */
  const megas = [
    "venusaur",
    "charizard",
    "blastoise",
    "aerodactyl",
    "beedrill",
    "pinsir",
    "kangaskhan",
    "gyarados",
    "pidgeot",
    "alakazam",
    "gengar"
  ];

  async function loadShinys() {
    // Shinys da Pokédex Kanto
    for (let i = 1; i <= 151; i++) {
      const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${i}`);
      const p = await res.json();
      renderCard(p.name, p.sprites.front_shiny, false);
    }

    // Megas
    megas.forEach(name => {
      renderCard(
        `Mega ${capitalize(name)}`,
        `https://img.pokemondb.net/sprites/home/shiny/${name}.png`,
        true
      );
    });
  }

  function renderCard(name, img, isMega) {
    const card = document.createElement("div");
    card.className = "card" + (isMega ? " mega" : "");

    card.innerHTML = `
      <div class="slot">Capturados</div>
      <img src="${img}" loading="lazy">
      <strong>${capitalize(name)}</strong>
    `;

    grid.appendChild(card);
  }

  function capitalize(text) {
    return text
      .split(" ")
      .map(w => w.charAt(0).toUpperCase() + w.slice(1))
      .join(" ");
  }

  loadShinys();
</script>

</body>
</html>
