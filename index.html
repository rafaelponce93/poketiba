<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinys, Megas & Especiais</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e5e7eb;
}

header {
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
  padding: 30px;
  text-align: center;
}

.counters {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 15px;
}

.counter {
  background: white;
  color: #111;
  padding: 10px 18px;
  border-radius: 20px;
  font-weight: bold;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 20px;
}

button {
  padding: 12px 22px;
  border-radius: 25px;
  border: none;
  background: #facc15;
  font-weight: bold;
  cursor: pointer;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 6px 15px rgba(0,0,0,.15);
}

.card img {
  width: 160px;
}

.shiny { border: 3px solid gold; }
.mega { border: 3px solid #7c3aed; }
.special { border: 3px solid #0ea5e9; }

.hidden { display: none; }
</style>
</head>

<body>

<header>
  <h1>✨ Pokeclt</h1>
  <p>Shinys, Megas & Especiais — Atualização Oficial</p>

  <div class="counters">
    <div class="counter" id="shinyCount"></div>
    <div class="counter" id="megaCount"></div>
    <div class="counter" id="specialCount"></div>
  </div>
</header>

<div class="controls">
  <button onclick="show('shinys')">✨ Shinys</button>
  <button onclick="show('megas')">🧬 Megas</button>
  <button onclick="show('specials')">💎 Especiais</button>
</div>

<div id="shinys" class="grid"></div>
<div id="megas" class="grid hidden"></div>
<div id="specials" class="grid hidden"></div>

<script>
/* ===== SHINYS (NÃO TOQUEI) ===== */
const SHINYS = {
  venusaur: 0, charizard: 1, blastoise: 0, butterfree: 0, beedrill: 0,
  pidgeot: 0, raticate: 0, fearow: 0, arbok: 0, raichu: 0,
  sandslash: 0, nidoqueen: 0, nidoking: 0, clefable: 0,
  ninetales: 0, wigglytuff: 0, golbat: 0, vileplume: 0,
  parasect: 0, venomoth: 0, dugtrio: 0, persian: 0,
  golduck: 0, primeape: 0, arcanine: 0, poliwrath: 0,
  alakazam: 0, machamp: 0, victreebel: 0, tentacruel: 0,
  golem: 0, rapidash: 0, slowbro: 0, magneton: 0,
  farfetchd: 0, dodrio: 0, dewgong: 0, muk: 0,
  cloyster: 0, gengar: 0, hypno: 0, kingler: 0,
  electrode: 0, exeggutor: 0, marowak: 0, hitmonlee: 0,
  hitmonchan: 0, weezing: 0, rhydon: 0, chansey: 0,
  tangela: 0, kangaskhan: 0, seadra: 0, seaking: 0,
  starmie: 0, mrmime: 0, scyther: 0, jynx: 0,
  electabuzz: 0, magmar: 0, pinsir: 0, tauros: 0,
  gyarados: 0, lapras: 0, ditto: 0, vaporeon: 0,
  jolteon: 0, flareon: 0, porygon: 0, omastar: 0,
  kabutops: 0, aerodactyl: 1, snorlax: 0,
  articuno: 0, zapdos: 0, moltres: 0,
  dragonite: 0, mewtwo: 0, mew: 0
};

/* ===== MEGAS ===== */
const MEGAS = {
  "charizard-megax": "Mega Charizard X",
  "alakazam-mega": "Mega Alakazam",
  "gengar-mega": "Mega Gengar",
  "gyarados-mega": "Mega Gyarados",
  "kangaskhan-mega": "Mega Kangaskhan",
  "pinsir-mega": "Mega Pinsir",
  "pidgeot-mega": "Mega Pidgeot",
  "aerodactyl-mega": "Mega Aerodactyl",
  "venusaur-mega": "Mega Venusaur",
  "blastoise-mega": "Mega Blastoise",
  "beedrill-mega": "Mega Beedrill"
};

/* ===== CRYSTAL ÔNIX EMBUTIDO (NUNCA SOME) ===== */
const CRYSTAL_ONIX_IMG =
`data:image/svg+xml;utf8,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'>
<defs>
<linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
<stop offset='0%' stop-color='%230ea5e9'/>
<stop offset='100%' stop-color='%23022444'/>
</linearGradient>
</defs>
<rect width='200' height='200' rx='20' fill='url(%23g)'/>
<text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle'
font-size='26' fill='white' font-family='Arial'>CRYSTAL ÔNIX</text>
</svg>`;

/* CONTADORES */
shinyCount.textContent = `✨ Shinys: ${Object.values(SHINYS).filter(v=>v>0).length} / ${Object.keys(SHINYS).length}`;
megaCount.textContent = `🧬 Megas: ${Object.keys(MEGAS).length}`;
specialCount.textContent = `💎 Especiais: 1`;

/* RENDER */
for (let p in SHINYS) {
  shinys.innerHTML += `
  <div class="card ${SHINYS[p]>0?'shiny':''}">
    <img src="https://play.pokemonshowdown.com/sprites/ani-shiny/${p}.gif">
    <b>${p}</b>
  </div>`;
}

for (let m in MEGAS) {
  megas.innerHTML += `
  <div class="card mega">
    <img src="https://play.pokemonshowdown.com/sprites/ani/${m}.gif">
    <b>${MEGAS[m]}</b>
  </div>`;
}

specials.innerHTML = `
<div class="card special">
  <img src="${CRYSTAL_ONIX_IMG}">
  <b>Crystal Ônix</b>
</div>`;

/* NAVEGAÇÃO */
function show(id) {
  shinys.classList.add("hidden");
  megas.classList.add("hidden");
  specials.classList.add("hidden");
  document.getElementById(id).classList.remove("hidden");
}
</script>

</body>
</html>
