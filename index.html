<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinydex Kanto</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Shinydex e Megadex Kanto oficial do Pokeclt">

<style>
body {
  font-family: Arial, sans-serif;
  background: #fff7cc;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

#top-info {
  text-align: center;
  margin-bottom: 15px;
  font-weight: bold;
}

#buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
}

button {
  padding: 8px 16px;
  border-radius: 20px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button.active {
  background: gold;
}

button:not(.active) {
  background: #ddd;
}

#pokemon-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 15px;
}

.pokemon-card {
  background: white;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

.pokemon-card.highlight {
  border: 2px solid gold;
  background: #fffbe6;
}

.pokemon-card img {
  width: 96px;
  height: 96px;
}

.pokemon-name {
  font-weight: bold;
  text-transform: capitalize;
  margin-top: 5px;
}

.types {
  font-size: 12px;
  margin: 5px 0;
  color: #555;
}

.stat {
  font-size: 13px;
  margin-top: 6px;
}
</style>
</head>

<body>

<h1>✨ Pokeclt – Kanto</h1>

<div id="top-info"></div>

<div id="buttons">
  <button id="btn-shiny" class="active">✨ Shinys</button>
  <button id="btn-mega">🧬 Megas</button>
</div>

<div id="pokemon-container"></div>

<script>
/* ==================================================
   👉 EDITE SOMENTE OS NÚMEROS AQUI 👈
   ================================================== */

const POKEMON_DATA = {
  venusaur: { shiny: 0, mega: 0 },
  charizard: { shiny: 1, mega: 1 },
  blastoise: { shiny: 0, mega: 0 },
  butterfree: { shiny: 0 },
  beedrill: { shiny: 0, mega: 0 },
  pidgeot: { shiny: 0, mega: 0 },
  raticate: { shiny: 0 },
  fearow: { shiny: 0 },
  arbok: { shiny: 0 },
  raichu: { shiny: 0 },
  sandslash: { shiny: 0 },
  nidoqueen: { shiny: 0 },
  nidoking: { shiny: 0 },
  clefable: { shiny: 0 },
  ninetales: { shiny: 0 },
  wigglytuff: { shiny: 0 },
  golbat: { shiny: 0 },
  vileplume: { shiny: 0 },
  parasect: { shiny: 0 },
  venomoth: { shiny: 0 },
  dugtrio: { shiny: 0 },
  persian: { shiny: 0 },
  golduck: { shiny: 0 },
  primeape: { shiny: 0 },
  arcanine: { shiny: 0 },
  poliwrath: { shiny: 0 },
  alakazam: { shiny: 0, mega: 0 },
  machamp: { shiny: 0 },
  victreebel: { shiny: 0 },
  tentacruel: { shiny: 0 },
  golem: { shiny: 0 },
  rapidash: { shiny: 0 },
  slowbro: { shiny: 0 },
  magneton: { shiny: 0 },
  farfetchd: { shiny: 0 },
  dodrio: { shiny: 0 },
  dewgong: { shiny: 0 },
  muk: { shiny: 0 },
  cloyster: { shiny: 0 },
  gengar: { shiny: 0, mega: 0 },
  onix: { shiny: 0 },
  hypno: { shiny: 0 },
  kingler: { shiny: 0 },
  electrode: { shiny: 0 },
  exeggutor: { shiny: 0 },
  marowak: { shiny: 0 },
  hitmonlee: { shiny: 0 },
  hitmonchan: { shiny: 0 },
  lickitung: { shiny: 0 },
  weezing: { shiny: 0 },
  rhydon: { shiny: 0 },
  chansey: { shiny: 0 },
  tangela: { shiny: 0 },
  kangaskhan: { shiny: 0, mega: 0 },
  seadra: { shiny: 0 },
  seaking: { shiny: 0 },
  starmie: { shiny: 0 },
  "mr-mime": { shiny: 0 },
  scyther: { shiny: 0 },
  jynx: { shiny: 0 },
  electabuzz: { shiny: 0 },
  magmar: { shiny: 0 },
  pinsir: { shiny: 0, mega: 0 },
  tauros: { shiny: 0 },
  gyarados: { shiny: 0, mega: 0 },
  lapras: { shiny: 0 },
  ditto: { shiny: 0 },
  vaporeon: { shiny: 0 },
  jolteon: { shiny: 0 },
  flareon: { shiny: 0 },
  porygon: { shiny: 0 },
  omastar: { shiny: 0 },
  kabutops: { shiny: 0 },
  aerodactyl: { shiny: 1, mega: 1 },
  snorlax: { shiny: 0 },
  articuno: { shiny: 0 },
  zapdos: { shiny: 0 },
  moltres: { shiny: 0 },
  dragonite: { shiny: 0 },
  mewtwo: { shiny: 0 },
  mew: { shiny: 0 }
};

const container = document.getElementById("pokemon-container");
const topInfo = document.getElementById("top-info");
const btnShiny = document.getElementById("btn-shiny");
const btnMega = document.getElementById("btn-mega");

let mode = "shiny";

btnShiny.onclick = () => switchMode("shiny");
btnMega.onclick = () => switchMode("mega");

function switchMode(newMode) {
  mode = newMode;
  btnShiny.classList.toggle("active", mode === "shiny");
  btnMega.classList.toggle("active", mode === "mega");
  render();
}

async function render() {
  container.innerHTML = "";
  let total = 0;

  for (const name in POKEMON_DATA) {
    const dataApi = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`).then(r => r.json());
    const value = POKEMON_DATA[name][mode] ?? 0;

    if (mode === "mega" && POKEMON_DATA[name].mega === undefined) continue;

    total += value;

    const card = document.createElement("div");
    card.className = "pokemon-card";
    if (value > 0) card.classList.add("highlight");

    card.innerHTML = `
      <img src="${dataApi.sprites.front_default}">
      <div class="pokemon-name">${dataApi.name}</div>
      <div class="types">${dataApi.types.map(t => t.type.name).join(" / ")}</div>
      <div class="stat">
        ${mode === "shiny" ? "✨ Shinys capturados" : "🧬 Megas feitos"}: ${value}
      </div>
    `;

    container.appendChild(card);
  }

  topInfo.textContent =
    mode === "shiny"
      ? `✨ Total de Shinys: ${total}`
      : `🧬 Total de Megas: ${total}`;
}

render();
</script>

</body>
</html>
