<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinydex Kanto</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

#pokemon-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 15px;
}

.pokemon-card {
  background: white;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

.pokemon-card img {
  width: 96px;
  height: 96px;
}

.pokemon-name {
  font-weight: bold;
  text-transform: capitalize;
  margin-top: 5px;
}

.types {
  font-size: 12px;
  margin: 5px 0;
  color: #555;
}

.stat {
  font-size: 13px;
  margin-top: 6px;
}
</style>
</head>

<body>

<h1>✨ Pokeclt – Shinydex Kanto (Últimas Evoluções)</h1>

<div id="pokemon-container"></div>

<script>
// ==================================================
// 👉 ÚLTIMAS EVOLUÇÕES DE KANTO
// ==================================================
const ULTIMAS_EVOLUCOES = [
  "venusaur","charizard","blastoise","butterfree","beedrill","pidgeot",
  "raticate","fearow","arbok","raichu","sandslash","nidoqueen","nidoking",
  "clefable","ninetales","wigglytuff","golbat","vileplume","parasect",
  "venomoth","dugtrio","persian","golduck","primeape","arcanine",
  "poliwrath","alakazam","machamp","victreebel","tentacruel","golem",
  "rapidash","slowbro","magneton","farfetchd","dodrio","dewgong","muk",
  "cloyster","gengar","onix","hypno","kingler","electrode","exeggutor",
  "marowak","hitmonlee","hitmonchan","lickitung","weezing","rhydon",
  "chansey","tangela","kangaskhan","seadra","seaking","starmie","mr-mime",
  "scyther","jynx","electabuzz","magmar","pinsir","tauros","gyarados",
  "lapras","ditto","vaporeon","jolteon","flareon","porygon","omastar",
  "kabutops","aerodactyl","snorlax","articuno","zapdos","moltres",
  "dragonite","mewtwo","mew"
];

// ==================================================
// 👉 SHINYS (EDITÁVEL)
// ==================================================
const SHINYS = {
  venusaur: 4,
  charizard: 11,
  blastoise: 5,
  butterfree: 0,
  beedrill: 0,
  pidgeot: 17,
  raticate: 0,
  fearow: 0,
  arbok: 0,
  raichu: 3,
  sandslash: 2,
  nidoqueen: 0,
  nidoking: 0,
  clefable: 1,
  ninetales: 0,
  wigglytuff: 1,
  golbat: 0,
  vileplume: 2,
  parasect: 0,
  venomoth: 0,
  dugtrio: 0,
  persian: 0,
  golduck: 0,
  primeape: 0,
  arcanine: 0,
  poliwrath: 4,
  alakazam: 12,
  machamp: 8,
  victreebel: 4,
  tentacruel: 0,
  golem: 10,
  rapidash: 0,
  slowbro: 0,
  magneton: 1,
  farfetchd: 1,
  dodrio: 0,
  dewgong: 0,
  muk: 0,
  cloyster: 0,
  gengar: 9,
  onix: 0,
  hypno: 0,
  kingler: 0,
  electrode: 0,
  exeggutor: 1,
  marowak: 2,
  hitmonlee: 1,
  hitmonchan: 0,
  lickitung: 0,
  weezing: 0,
  rhydon: 7,
  chansey: 1,
  tangela: 0,
  kangaskhan: 0,
  seadra: 0,
  seaking: 0,
  starmie: 0,
  "mr-mime": 0,
  scyther: 4,
  jynx: 10,
  electabuzz: 11,
  magmar: 9,
  pinsir: 3,
  tauros: 0,
  gyarados: 13,
  lapras: 1,
  ditto: 5,
  vaporeon: 2,
  jolteon: 1,
  flareon: 0,
  porygon: 0,
  omastar: 0,
  kabutops: 1,
  aerodactyl: 2,
  snorlax: 5,
  articuno: 0,
  zapdos: 0,
  moltres: 0,
  dragonite: 10,
};

// ==================================================
// 👉 MEGAS FEITOS (EDITÁVEL)
// ==================================================
const MEGAS = {
  charizard: 2,
  blastoise: 1,
  venusaur: 1,
  beedrill: 0,
  aerodactyl: 2,
  kangaskhan: 0,
  pidgeot: 1,
  alakazam: 1,
  gengar: 2,
  gyarados: 2,
  pinsir: 1,
};

const container = document.getElementById("pokemon-container");

async function loadPokemon() {
  for (const name of ULTIMAS_EVOLUCOES) {
    const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
    const data = await res.json();

    const shiny = SHINYS[name] ?? 0;
    const mega = MEGAS[name];

    const card = document.createElement("div");
    card.className = "pokemon-card";

    card.innerHTML = `
      <img src="${data.sprites.front_default}">
      <div class="pokemon-name">${data.name}</div>
      <div class="types">${data.types.map(t => t.type.name).join(" / ")}</div>
      <div class="stat">✨ Shinys capturados: ${shiny}</div>
      ${mega !== undefined ? `<div class="stat">🧬 Megas feitos: ${mega}</div>` : ""}
    `;

    container.appendChild(card);
  }
}

loadPokemon();
</script>

</body>
</html>
