<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinydex Kanto</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

#pokemon-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 15px;
}

.pokemon-card {
  background: white;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

.pokemon-card img {
  width: 96px;
  height: 96px;
}

.pokemon-name {
  font-weight: bold;
  text-transform: capitalize;
  margin-top: 5px;
}

.types {
  font-size: 12px;
  margin: 5px 0;
  color: #555;
}

.stat {
  font-size: 13px;
  margin-top: 6px;
}
</style>
</head>

<body>

<h1>✨ Pokeclt – Shinydex Kanto (Últimas Evoluções)</h1>

<div id="pokemon-container"></div>

<script>
// ==================================================
// 👉 LISTA – ÚLTIMAS EVOLUÇÕES DE KANTO 👈
// ==================================================
const ULTIMAS_EVOLUCOES = [
  "venusaur","charizard","blastoise",
  "butterfree","beedrill","pidgeot","raticate","fearow","arbok",
  "raichu","sandslash","nidoqueen","nidoking","clefable","ninetales",
  "wigglytuff","golbat","vileplume","parasect","venomoth","dugtrio",
  "persian","golduck","primeape","arcanine","poliwrath","alakazam",
  "machamp","victreebel","tentacruel","golem","rapidash","slowbro",
  "magneton","farfetchd","dodrio","dewgong","muk","cloyster","gengar",
  "onix","hypno","kingler","electrode","exeggutor","marowak",
  "hitmonlee","hitmonchan","lickitung","weezing","rhydon","chansey",
  "tangela","kangaskhan","seadra","seaking","starmie","mr-mime",
  "scyther","jynx","electabuzz","magmar","pinsir","tauros",
  "gyarados","lapras","ditto","vaporeon","jolteon","flareon",
  "porygon","omastar","kabutops","aerodactyl","snorlax",
  "articuno","zapdos","moltres","dragonite","mewtwo","mew"
];

// ==================================================
// 👉 SHINYS (VOCÊ SÓ MUDA OS NÚMEROS) 👈
// ==================================================
const SHINYS = {
  venusaur: 0,
  charizard: 1,
  blastoise: 0,
  golem: 0,
  rhydon: 0,
  gengar: 0,
  gyarados: 0,
  aerodactyl: 1,
  dragonite: 0,
  mewtwo: 0,
  mew: 0
};

const container = document.getElementById("pokemon-container");

async function loadPokemon() {
  for (const name of ULTIMAS_EVOLUCOES) {
    const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
    const data = await res.json();

    const card = document.createElement("div");
    card.className = "pokemon-card";

    card.innerHTML = `
      <img src="${data.sprites.front_default}">
      <div class="pokemon-name">${data.name}</div>
      <div class="types">${data.types.map(t => t.type.name).join(" / ")}</div>
      <div class="stat">✨ Shinys capturados: ${SHINYS[data.name] ?? 0}</div>
    `;

    container.appendChild(card);
  }
}

loadPokemon();
</script>

</body>
</html>
