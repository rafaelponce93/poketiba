<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinys & Megas</title>

<style>
:root {
  --bg: #f4f4f4;
  --card: #fff;
  --text: #000;
}

body.dark {
  --bg: #121212;
  --card: #1e1e1e;
  --text: #fff;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

h1 {
  text-align: center;
}

.top-bar {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
}

button {
  padding: 14px 24px;
  font-size: 18px;
  cursor: pointer;
  border-radius: 10px;
  border: none;
}

.toggle-btn {
  background: #ffcc00;
}

.mode-btn {
  background: #555;
  color: white;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 18px;
}

.card {
  background: var(--card);
  border-radius: 14px;
  padding: 12px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,.2);
}

.card img {
  width: 140px;
}

.name {
  font-weight: bold;
  margin-top: 6px;
}

.stat {
  margin-top: 6px;
  font-size: 15px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<h1>✨ Pokeclt – Shinys & Megas</h1>

<div class="top-bar">
  <button class="toggle-btn" onclick="toggle()">Shinys 🔁 Megas</button>
  <button class="mode-btn" onclick="toggleMode()">🌙 / ☀️</button>
</div>

<div id="shinys" class="grid"></div>
<div id="megas" class="grid hidden"></div>

<script>
/* ========= SHINYS (última evolução) ========= */
const DEFAULT_SHINYS = {
  venusaur: 0, charizard: 1, blastoise: 0, butterfree: 0, beedrill: 0,
  pidgeot: 0, raichu: 0, sandslash: 0, nidoqueen: 0, nidoking: 0,
  clefable: 0, ninetales: 0, wigglytuff: 0, vileplume: 0,
  dugtrio: 0, persian: 0, golduck: 0, primeape: 0, arcanine: 0,
  poliwrath: 0, alakazam: 0, machamp: 0, victreebel: 0,
  tentacruel: 0, golem: 0, rapidash: 0, slowbro: 0,
  magneton: 0, dodrio: 0, dewgong: 0, muk: 0, cloyster: 0,
  gengar: 0, hypno: 0, kingler: 0, electrode: 0,
  exeggutor: 0, marowak: 0, weezing: 0, rhydon: 0,
  chansey: 0, kangaskhan: 0, seaking: 0, starmie: 0,
  "mr-mime": 0, scyther: 0, jynx: 0, electabuzz: 0,
  magmar: 0, pinsir: 0, tauros: 0, gyarados: 0,
  lapras: 0, ditto: 0, vaporeon: 0, jolteon: 0,
  flareon: 0, porygon: 0, omastar: 0, kabutops: 0,
  aerodactyl: 1, snorlax: 0, articuno: 0,
  zapdos: 0, moltres: 0, dragonite: 0, mewtwo: 0, mew: 0
};

const shinys = JSON.parse(localStorage.getItem("shinys")) || DEFAULT_SHINYS;
localStorage.setItem("shinys", JSON.stringify(shinys));

/* ========= MEGAS ========= */
const MEGAS = {
  "charizard-mega-x": { nome: "Mega Charizard X", player: "Rafael" },
  "alakazam-mega": { nome: "Mega Alakazam", player: "" },
  "gengar-mega": { nome: "Mega Gengar", player: "" },
  "gyarados-mega": { nome: "Mega Gyarados", player: "" },
  "kangaskhan-mega": { nome: "Mega Kangaskhan", player: "" },
  "pinsir-mega": { nome: "Mega Pinsir", player: "" },
  "pidgeot-mega": { nome: "Mega Pidgeot", player: "" },
  "aerodactyl-mega": { nome: "Mega Aerodactyl", player: "" },
  "venusaur-mega": { nome: "Mega Venusaur", player: "" },
  "blastoise-mega": { nome: "Mega Blastoise", player: "" },
  "beedrill-mega": { nome: "Mega Beedrill", player: "" }
};

/* ========= RENDER SHINYS ========= */
const shinyDiv = document.getElementById("shinys");

function renderShinys() {
  shinyDiv.innerHTML = "";
  for (const pkm in shinys) {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = `https://play.pokemonshowdown.com/sprites/ani-shiny/${pkm}.gif`;

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = pkm.replace("-", " ");

    const stat = document.createElement("div");
    stat.className = "stat";
    stat.textContent = `✨ Shinys: ${shinys[pkm]}`;

    card.onclick = () => {
      const v = prompt(`Quantos shinys de ${pkm}?`, shinys[pkm]);
      if (v !== null) {
        shinys[pkm] = Number(v);
        localStorage.setItem("shinys", JSON.stringify(shinys));
        renderShinys();
      }
    };

    card.append(img, name, stat);
    shinyDiv.appendChild(card);
  }
}
renderShinys();

/* ========= RENDER MEGAS ========= */
const megaDiv = document.getElementById("megas");

for (const mega in MEGAS) {
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = `https://play.pokemonshowdown.com/sprites/ani/${mega}.gif`;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = MEGAS[mega].nome;

  const player = document.createElement("div");
  player.className = "stat";
  player.textContent = `👤 Player: ${MEGAS[mega].player || "-"}`;

  card.append(img, name, player);
  megaDiv.appendChild(card);
}

/* ========= TOGGLES ========= */
function toggle() {
  shinyDiv.classList.toggle("hidden");
  megaDiv.classList.toggle("hidden");
}

function toggleMode() {
  document.body.classList.toggle("dark");
  localStorage.setItem("mode", document.body.classList.contains("dark"));
}

if (localStorage.getItem("mode") === "true") {
  document.body.classList.add("dark");
}
</script>

</body>
</html>
