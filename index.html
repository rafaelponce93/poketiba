<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinys, Megas & Especiais</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;
  flex-wrap: wrap;
}

button {
  padding: 14px 28px;
  font-size: 18px;
  cursor: pointer;
  border-radius: 10px;
  border: none;
  background: #ffcc00;
  font-weight: bold;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 18px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 12px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}

.card img {
  width: 140px;
}

.name {
  font-weight: bold;
  margin-top: 6px;
  text-transform: capitalize;
}

.stat {
  font-size: 14px;
  margin-top: 6px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<h1>✨ Pokeclt – Shinys, Megas & Especiais</h1>

<div class="buttons">
  <button onclick="showTab('shinys')">✨ Shinys</button>
  <button onclick="showTab('megas')">💥 Megas</button>
  <button onclick="showTab('special')">🔮 Especiais</button>
</div>

<div id="shinys" class="grid"></div>
<div id="megas" class="grid hidden"></div>
<div id="special" class="grid hidden"></div>

<script>
/* ======================
   👉 EDITE OS SHINYS 👈
   ====================== */
const SHINYS = {
  venusaur: 0,
  charizard: 1,
  blastoise: 0,
  butterfree: 0,
  beedrill: 0,
  pidgeot: 0,
  raichu: 0,
  nidoqueen: 0,
  nidoking: 0,
  ninetales: 0,
  vileplume: 0,
  golduck: 0,
  arcanine: 0,
  alakazam: 0,
  machamp: 0,
  golem: 0,
  slowbro: 0,
  gengar: 0,
  rhydon: 0,
  chansey: 0,
  kangaskhan: 0,
  starmie: 0,
  "mr-mime": 0,
  scyther: 0,
  jynx: 0,
  electabuzz: 0,
  magmar: 0,
  pinsir: 0,
  gyarados: 0,
  lapras: 0,
  vaporeon: 0,
  jolteon: 0,
  flareon: 0,
  aerodactyl: 1,
  snorlax: 0,
  articuno: 0,
  zapdos: 0,
  moltres: 0,
  dragonite: 0,
  mewtwo: 0,
  mew: 0
};

/* ======================
   👉 EDITE OS MEGAS 👈
   ====================== */
const MEGAS = {
  "charizard-mega-x": { nome: "Mega Charizard X", player: "Rafael" },
  "alakazam-mega": { nome: "Mega Alakazam", player: "" },
  "gengar-mega": { nome: "Mega Gengar", player: "" },
  "gyarados-mega": { nome: "Mega Gyarados", player: "" },
  "kangaskhan-mega": { nome: "Mega Kangaskhan", player: "" },
  "pinsir-mega": { nome: "Mega Pinsir", player: "" },
  "pidgeot-mega": { nome: "Mega Pidgeot", player: "" },
  "aerodactyl-mega": { nome: "Mega Aerodactyl", player: "" },
  "venusaur-mega": { nome: "Mega Venusaur", player: "" },
  "blastoise-mega": { nome: "Mega Blastoise", player: "" },
  "beedrill-mega": { nome: "Mega Beedrill", player: "" }
};

/* ======================
   👉 ESPECIAIS 👈
   ====================== */
const SPECIALS = [
  {
    nome: "Crystal Onix",
    img: "https://static.wikia.nocookie.net/pokemon/images/3/3e/Crystal_Onix.png"
  }
];

/* ======================
   RENDER SHINYS
   ====================== */
const shinyDiv = document.getElementById("shinys");

for (const pkm in SHINYS) {
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = `https://play.pokemonshowdown.com/sprites/ani-shiny/${pkm}.gif`;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = pkm === "mr-mime" ? "Mr. Mime" : pkm.replace("-", " ");

  const stat = document.createElement("div");
  stat.className = "stat";
  stat.textContent = `✨ Shinys capturados: ${SHINYS[pkm]}`;

  card.append(img, name, stat);
  shinyDiv.appendChild(card);
}

/* ======================
   RENDER MEGAS
   ====================== */
const megaDiv = document.getElementById("megas");

for (const mega in MEGAS) {
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = `https://play.pokemonshowdown.com/sprites/ani/${mega}.gif`;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = MEGAS[mega].nome;

  const player = document.createElement("div");
  player.className = "stat";
  player.textContent = `👤 Player: ${MEGAS[mega].player || "-"}`;

  card.append(img, name, player);
  megaDiv.appendChild(card);
}

/* ======================
   RENDER ESPECIAIS
   ====================== */
const specialDiv = document.getElementById("special");

SPECIALS.forEach(sp => {
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = sp.img;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = sp.nome;

  card.append(img, name);
  specialDiv.appendChild(card);
});

/* ======================
   CONTROLE DE TELAS
   ====================== */
function showTab(tab) {
  document.getElementById("shinys").classList.add("hidden");
  document.getElementById("megas").classList.add("hidden");
  document.getElementById("special").classList.add("hidden");
  document.getElementById(tab).classList.remove("hidden");
}
</script>

</body>
</html>
