<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinys & Megas</title>

<style>
:root {
  --bg: #0f172a;
  --card: #ffffff;
  --accent: #facc15;
  --text: #111827;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e5e7eb;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
  padding: 25px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin-top: 5px;
  color: #cbd5f5;
}

/* BOTÃO */
button {
  display: block;
  margin: 20px auto;
  padding: 12px 30px;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  background: var(--accent);
  cursor: pointer;
  font-weight: bold;
  transition: transform .2s, box-shadow .2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 15px rgba(0,0,0,.25);
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
  padding: 20px;
}

/* CARD */
.card {
  background: var(--card);
  border-radius: 16px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 6px 15px rgba(0,0,0,.15);
  transition: transform .2s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 160px;
  image-rendering: pixelated;
}

.name {
  font-weight: bold;
  margin-top: 8px;
  font-size: 18px;
  text-transform: capitalize;
}

.stat {
  font-size: 14px;
  margin-top: 6px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>✨ Pokeclt</h1>
  <p>Shinys & Megas — Atualização Oficial</p>
</header>

<button onclick="toggle()">Shinys 🔁 Megas</button>

<div id="shinys" class="grid"></div>
<div id="megas" class="grid hidden"></div>

<script>
/* ===== SHINYS ===== */
const SHINYS = {
  venusaur: 0, charizard: 1, blastoise: 0,
  butterfree: 0, beedrill: 0, pidgeot: 0,
  raticate: 0, fearow: 0, arbok: 0,
  raichu: 0, sandslash: 0, nidoqueen: 0,
  nidoking: 0, clefable: 0, ninetales: 0,
  wigglytuff: 0, golbat: 0, vileplume: 0,
  parasect: 0, venomoth: 0, dugtrio: 0,
  persian: 0, golduck: 0, primeape: 0,
  arcanine: 0, poliwrath: 0, alakazam: 0,
  machamp: 0, victreebel: 0, tentacruel: 0,
  golem: 0, rapidash: 0, slowbro: 0,
  magneton: 0, farfetchd: 0, dodrio: 0,
  dewgong: 0, muk: 0, cloyster: 0,
  gengar: 0, hypno: 0, kingler: 0,
  electrode: 0, exeggutor: 0, marowak: 0,
  hitmonlee: 0, hitmonchan: 0, weezing: 0,
  rhydon: 0, chansey: 0, tangela: 0,
  kangaskhan: 0, seadra: 0, seaking: 0,
  starmie: 0, "mr-mime": 0, scyther: 0,
  jynx: 0, electabuzz: 0, magmar: 0,
  pinsir: 0, tauros: 0, gyarados: 0,
  lapras: 0, ditto: 0, vaporeon: 0,
  jolteon: 0, flareon: 0, porygon: 0,
  omastar: 0, kabutops: 0, aerodactyl: 1,
  snorlax: 0, articuno: 0, zapdos: 0,
  moltres: 0, dragonite: 0, mewtwo: 0, mew: 0
};

/* ===== MEGAS ===== */
const MEGAS = {
  "charizard-mega-x": { nome: "Mega Charizard X", player: "Rafael" },
  "alakazam-mega": { nome: "Mega Alakazam", player: "" },
  "gengar-mega": { nome: "Mega Gengar", player: "" },
  "gyarados-mega": { nome: "Mega Gyarados", player: "" },
  "kangaskhan-mega": { nome: "Mega Kangaskhan", player: "" },
  "pinsir-mega": { nome: "Mega Pinsir", player: "" },
  "pidgeot-mega": { nome: "Mega Pidgeot", player: "" },
  "aerodactyl-mega": { nome: "Mega Aerodactyl", player: "" },
  "venusaur-mega": { nome: "Mega Venusaur", player: "" },
  "blastoise-mega": { nome: "Mega Blastoise", player: "" },
  "beedrill-mega": { nome: "Mega Beedrill", player: "" }
};

/* RENDER SHINYS */
const shinyDiv = document.getElementById("shinys");
for (const pkm in SHINYS) {
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = `https://play.pokemonshowdown.com/sprites/ani-shiny/${pkm}.gif`;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = pkm.replace("-", " ");

  const stat = document.createElement("div");
  stat.className = "stat";
  stat.textContent = `✨ Shinys capturados: ${SHINYS[pkm]}`;

  if (SHINYS[pkm] > 0) {
    card.style.border = "3px solid gold";
  }

  card.append(img, name, stat);
  shinyDiv.appendChild(card);
}

/* RENDER MEGAS */
const megaDiv = document.getElementById("megas");
for (const mega in MEGAS) {
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = `https://play.pokemonshowdown.com/sprites/ani/${mega}.gif`;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = MEGAS[mega].nome;

  const player = document.createElement("div");
  player.className = "stat";
  player.textContent = `👤 Player: ${MEGAS[mega].player || "-"}`;

  card.append(img, name, player);
  megaDiv.appendChild(card);
}

function toggle() {
  shinyDiv.classList.toggle("hidden");
  megaDiv.classList.toggle("hidden");
}
</script>

</body>
</html>
