<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poketiba — Shinydex Kanto</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #0f172a, #020617);
      color: #e5e7eb;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 1.5rem;
    }

    header h1 {
      font-size: 2.2rem;
    }

    header p {
      opacity: 0.8;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    input, select, button {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
    }

    input, select {
      min-width: 160px;
    }

    button {
      cursor: pointer;
      background: #38bdf8;
      color: #020617;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    #pokemonGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .card {
      background: #020617;
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(56,189,248,0.35);
    }

    .card.captured {
      outline: 3px solid gold;
    }

    .card img {
      width: 96px;
    }

    .card p {
      font-size: 0.8rem;
      opacity: 0.7;
    }

    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .hidden {
      display: none;
    }

    .modal-content {
      background: #020617;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      width: 280px;
      position: relative;
    }

    .modal-content img {
      width: 120px;
    }

    #closeModal {
      position: absolute;
      top: 10px;
      right: 14px;
      cursor: pointer;
      font-size: 1.2rem;
    }
  </style>
</head>

<body>

<header>
  <h1>Poketiba</h1>
  <p>Shinydex da Região de Kanto</p>

  <div class="controls">
    <input type="text" id="search" placeholder="Buscar Pokémon...">

    <select id="typeFilter">
      <option value="">Todos os tipos</option>
      <option value="normal">Normal</option>
      <option value="fire">Fire</option>
      <option value="water">Water</option>
      <option value="grass">Grass</option>
      <option value="electric">Electric</option>
      <option value="ice">Ice</option>
      <option value="fighting">Fighting</option>
      <option value="poison">Poison</option>
      <option value="ground">Ground</option>
      <option value="flying">Flying</option>
      <option value="psychic">Psychic</option>
      <option value="bug">Bug</option>
      <option value="rock">Rock</option>
      <option value="ghost">Ghost</option>
      <option value="dragon">Dragon</option>
    </select>

    <button id="toggleShiny">✨ Shiny</button>
  </div>
</header>

<main id="pokemonGrid"></main>

<div id="modal" class="hidden">
  <div class="modal-content">
    <span id="closeModal">✖</span>
    <img id="modalImg">
    <h2 id="modalName"></h2>
    <p id="modalTypes"></p>
    <button id="captureBtn">⭐ Marcar como capturado</button>
  </div>
</div>

<script>
  const grid = document.getElementById("pokemonGrid");
  const search = document.getElementById("search");
  const typeFilter = document.getElementById("typeFilter");
  const toggleShiny = document.getElementById("toggleShiny");

  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modalImg");
  const modalName = document.getElementById("modalName");
  const modalTypes = document.getElementById("modalTypes");
  const captureBtn = document.getElementById("captureBtn");
  const closeModal = document.getElementById("closeModal");

  let shinyMode = false;
  let pokemons = [];
  let captured = JSON.parse(localStorage.getItem("capturedPokemons")) || [];

  async function loadPokemons() {
    for (let i = 1; i <= 151; i++) {
      const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${i}`);
      const data = await res.json();
      pokemons.push(data);
    }
    render();
  }

  function render() {
    grid.innerHTML = "";

    const filtered = pokemons.filter(p =>
      p.name.includes(search.value.toLowerCase()) &&
      (!typeFilter.value ||
        p.types.some(t => t.type.name === typeFilter.value))
    );

    filtered.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      if (captured.includes(p.id)) card.classList.add("captured");

      const imgSrc = shinyMode
        ? p.sprites.front_shiny
        : p.sprites.front_default;

      card.innerHTML = `
        <img src="${imgSrc}" loading="lazy">
        <p>#${p.id}</p>
        <strong>${capitalize(p.name)}</strong>
      `;

      card.onclick = () => openModal(p);
      grid.appendChild(card);
    });
  }

  function openModal(pokemon) {
    modal.classList.remove("hidden");

    modalImg.src = shinyMode
      ? pokemon.sprites.front_shiny
      : pokemon.sprites.front_default;

    modalName.textContent = capitalize(pokemon.name);
    modalTypes.textContent =
      "Tipos: " + pokemon.types.map(t => t.type.name).join(", ");

    captureBtn.onclick = () => {
      if (!captured.includes(pokemon.id)) {
        captured.push(pokemon.id);
        localStorage.setItem(
          "capturedPokemons",
          JSON.stringify(captured)
        );
        render();
      }
    };
  }

  closeModal.onclick = () => modal.classList.add("hidden");

  search.oninput = render;
  typeFilter.onchange = render;

  toggleShiny.onclick = () => {
    shinyMode = !shinyMode;
    toggleShiny.textContent = shinyMode ? "🔁 Normal" : "✨ Shiny";
    render();
  };

  function capitalize(text) {
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  loadPokemons();
</script>

</body>
</html>
