<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinydex Kanto</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: linear-gradient(180deg, #f7f7f7, #eaeaea);
  margin: 0;
  padding: 16px;
}

h1 {
  text-align: center;
  margin-bottom: 12px;
}

#controls {
  text-align: center;
  margin-bottom: 20px;
}

button {
  padding: 10px 18px;
  margin: 6px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
  background: #ddd;
}

button.active {
  background: #222;
  color: #fff;
}

#pokemon-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 18px;
}

.pokemon-card {
  background: white;
  border-radius: 18px;
  padding: 16px;
  text-align: center;
  box-shadow: 0 8px 18px rgba(0,0,0,0.15);
}

.pokemon-card img {
  width: 160px;
  height: 160px;
}

.pokemon-name {
  font-weight: bold;
  text-transform: capitalize;
  font-size: 17px;
  margin-top: 8px;
}

.types {
  font-size: 13px;
  color: #555;
}

.stat {
  margin-top: 10px;
  font-size: 14px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>✨ Pokeclt – Shinydex Kanto</h1>

<div id="controls">
  <button id="btnShiny" class="active">✨ Shinys</button>
  <button id="btnMega">🧬 Megas</button>
</div>

<div id="pokemon-container"></div>

<script>
/* =====================================================
   👉 SHINYS – LISTA COMPLETA (EDITÁVEL)
   ===================================================== */

const SHINYS = {
  venusaur: 0, charizard: 1, blastoise: 0,
  butterfree: 0, beedrill: 0, pidgeot: 0,
  raticate: 0, fearow: 0, arbok: 0, raichu: 0,
  sandslash: 0, nidoqueen: 0, nidoking: 0,
  clefable: 0, ninetales: 0, wigglytuff: 0,
  golbat: 0, vileplume: 0, parasect: 0,
  venomoth: 0, dugtrio: 0, persian: 0,
  golduck: 0, primeape: 0, arcanine: 0,
  poliwrath: 0, alakazam: 0, machamp: 0,
  victreebel: 0, tentacruel: 0, golem: 0,
  rapidash: 0, slowbro: 0, magneton: 0,
  dodrio: 0, dewgong: 0, muk: 0,
  cloyster: 0, gengar: 0, hypno: 0,
  kingler: 0, electrode: 0, exeggutor: 0,
  marowak: 0, hitmonlee: 0, hitmonchan: 0,
  weezing: 0, rhydon: 0, chansey: 0,
  tangela: 0, kangaskhan: 0, seadra: 0,
  seaking: 0, starmie: 0, "mr-mime": 0,
  scyther: 0, jynx: 0, electabuzz: 0,
  magmar: 0, pinsir: 0, tauros: 0,
  gyarados: 0, lapras: 0, ditto: 0,
  vaporeon: 0, jolteon: 0, flareon: 0,
  porygon: 0, omastar: 0, kabutops: 0,
  aerodactyl: 1, snorlax: 0,
  articuno: 0, zapdos: 0, moltres: 0,
  dragonite: 0, mewtwo: 0, mew: 0
};

/* =====================================================
   👉 MEGAS (INALTERADO)
   ===================================================== */

const MEGAS = {
  venusaur: { count: 0, player: "" },
  charizard: { count: 1, player: "Você" },
  blastoise: { count: 0, player: "" },
  beedrill: { count: 0, player: "" },
  pidgeot: { count: 0, player: "" },
  alakazam: { count: 0, player: "" },
  gengar: { count: 0, player: "" },
  gyarados: { count: 0, player: "" },
  kangaskhan: { count: 0, player: "" },
  pinsir: { count: 0, player: "" },
  aerodactyl: { count: 1, player: "Você" }
};

const FINAL_EVOS = Object.keys(SHINYS);
const container = document.getElementById("pokemon-container");
let mode = "shiny";

document.getElementById("btnShiny").onclick = () => setMode("shiny");
document.getElementById("btnMega").onclick = () => setMode("mega");

function setMode(m) {
  mode = m;
  document.getElementById("btnShiny").classList.toggle("active", m==="shiny");
  document.getElementById("btnMega").classList.toggle("active", m==="mega");
  load();
}

async function load() {
  container.innerHTML = "";

  for (const name of FINAL_EVOS) {
    const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
    const data = await res.json();

    const card = document.createElement("div");
    card.className = "pokemon-card";

    const img = document.createElement("img");

    if (mode === "shiny") {
      img.src = `https://play.pokemonshowdown.com/sprites/xyani-shiny/${name}.gif`;
    } else {
      if (name === "charizard") {
        img.src = "https://img.pokemondb.net/sprites/black-white/anim/mega-charizard-x.gif";
      } else {
        img.src = `https://play.pokemonshowdown.com/sprites/xyani/${name}.gif`;
      }
    }

    const title = document.createElement("div");
    title.className = "pokemon-name";
    title.textContent = name;

    const types = document.createElement("div");
    types.className = "types";
    types.textContent = data.types.map(t => t.type.name).join(" / ");

    card.appendChild(img);
    card.appendChild(title);
    card.appendChild(types);

    if (mode === "shiny") {
      card.innerHTML += `<div class="stat">✨ Shinys capturados: ${SHINYS[name]}</div>`;
    }

    if (mode === "mega" && MEGAS[name]) {
      card.innerHTML += `
        <div class="stat">🧬 Megas feitos: ${MEGAS[name].count}</div>
        <div class="stat">👤 Player: ${MEGAS[name].player || "-"}</div>
      `;
    }

    container.appendChild(card);
  }
}

load();
</script>

</body>
</html>
