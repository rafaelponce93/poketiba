    }

    #pokemon-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .pokemon-card {
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .pokemon-card img {
      width: 96px;
    }

    .pokemon-name {
      font-weight: bold;
      text-transform: capitalize;
    }

    .types {
      font-size: 12px;
      color: #555;
      margin: 5px 0;
    }

    .stat {
      font-size: 13px;
      margin-top: 6px;
    }
  </style>
</head>
