<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinys, Megas & Especiais</title>

<style>
:root {
  --accent: #facc15;
  --mega: #7c3aed;
  --crystal: #2563eb;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e5e7eb;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
  padding: 30px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 36px;
}

header p {
  margin-top: 6px;
  color: #cbd5f5;
}

/* CONTADORES */
.counters {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.counter {
  background: white;
  color: #111;
  padding: 10px 18px;
  border-radius: 20px;
  font-weight: bold;
}

/* CONTROLES */
.controls {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin: 20px;
}

input {
  padding: 12px;
  font-size: 16px;
  border-radius: 20px;
  border: 1px solid #ccc;
}

button {
  padding: 16px 40px;
  font-size: 20px;
  font-weight: bold;
  border: none;
  border-radius: 40px;
  background: var(--accent);
  cursor: pointer;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 22px;
  padding: 20px;
}

/* CARD */
.card {
  background: white;
  border-radius: 18px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 6px 15px rgba(0,0,0,.15);
}

.card img {
  width: 160px;
  image-rendering: pixelated;
}

.name {
  font-weight: bold;
  margin-top: 8px;
  font-size: 18px;
  text-transform: capitalize;
}

.stat {
  font-size: 14px;
  margin-top: 6px;
}

/* SHINY */
.shiny {
  border: 3px solid gold;
}

/* MEGA */
.mega {
  border: 3px solid var(--mega);
}

/* CRYSTAL */
.crystal-card {
  border: 3px solid var(--crystal);
  box-shadow: 0 0 18px rgba(37,99,235,.8);
}

.crystal {
  filter:
    hue-rotate(195deg)
    saturate(2)
    brightness(1)
    contrast(1.1);
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>✨ Pokeclt</h1>
  <p>Shinys, Megas & Especiais — Atualização Oficial</p>

  <div class="counters">
    <div class="counter" id="shinyCount"></div>
    <div class="counter" id="megaCount"></div>
    <div class="counter" id="especialCount"></div>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="🔍 Buscar Pokémon...">
  <button onclick="toggle('shinys')">Shinys</button>
  <button onclick="toggle('megas')">Megas</button>
  <button onclick="toggle('especiais')">Especiais</button>
</div>

<div id="shinys" class="grid"></div>
<div id="megas" class="grid hidden"></div>
<div id="especiais" class="grid hidden"></div>

<script>
/* ===== SHINYS ===== */
const SHINYS = {
  venusaur: 0, charizard: 1, blastoise: 0, butterfree: 0,
  gengar: 0, gyarados: 0, aerodactyl: 1, mewtwo: 0
};

/* ===== MEGAS ===== */
const MEGAS = {
  "charizard-megax": { nome: "Mega Charizard X", player: "Rafael" },
  "alakazam-mega": { nome: "Mega Alakazam", player: "" },
  "gengar-mega": { nome: "Mega Gengar", player: "" },
  "gyarados-mega": { nome: "Mega Gyarados", player: "" }
};

/* ===== ESPECIAIS ===== */
const ESPECIAIS = {
  crystalonix: {
    nome: "Crystal Ônix",
    img: "https://play.pokemonshowdown.com/sprites/ani/onix.gif",
    player: "Rafael"
  }
};

/* CONTADORES */
document.getElementById("shinyCount").textContent =
  `✨ Shinys: ${Object.values(SHINYS).filter(v => v > 0).length} / ${Object.keys(SHINYS).length}`;

document.getElementById("megaCount").textContent =
  `🧬 Megas: ${Object.keys(MEGAS).length}`;

document.getElementById("especialCount").textContent =
  `💎 Especiais: ${Object.keys(ESPECIAIS).length}`;

/* RENDER SHINYS */
const shinyDiv = document.getElementById("shinys");
const megaDiv = document.getElementById("megas");
const especiaisDiv = document.getElementById("especiais");

function renderShinys(filter="") {
  shinyDiv.innerHTML = "";
  for (const pkm in SHINYS) {
    if (!pkm.includes(filter)) continue;
    const card = document.createElement("div");
    card.className = "card";
    if (SHINYS[pkm] > 0) card.classList.add("shiny");

    card.innerHTML = `
      <img src="https://play.pokemonshowdown.com/sprites/ani-shiny/${pkm}.gif">
      <div class="name">${pkm}</div>
      <div class="stat">✨ Shinys capturados: ${SHINYS[pkm]}</div>
    `;
    shinyDiv.appendChild(card);
  }
}

/* RENDER MEGAS */
function renderMegas(filter="") {
  megaDiv.innerHTML = "";
  for (const m in MEGAS) {
    if (!MEGAS[m].nome.toLowerCase().includes(filter)) continue;

    const card = document.createElement("div");
    card.className = "card mega";
    card.innerHTML = `
      <img src="https://play.pokemonshowdown.com/sprites/ani/${m}.gif">
      <div class="name">${MEGAS[m].nome}</div>
      <div class="stat">👤 Player: ${MEGAS[m].player || "-"}</div>
    `;
    megaDiv.appendChild(card);
  }
}

/* RENDER ESPECIAIS */
function renderEspeciais(filter="") {
  especiaisDiv.innerHTML = "";
  for (const e in ESPECIAIS) {
    if (!ESPECIAIS[e].nome.toLowerCase().includes(filter)) continue;

    const card = document.createElement("div");
    card.className = "card crystal-card";
    card.innerHTML = `
      <img class="crystal" src="${ESPECIAIS[e].img}">
      <div class="name">${ESPECIAIS[e].nome}</div>
      <div class="stat">👤 Player: ${ESPECIAIS[e].player}</div>
    `;
    especiaisDiv.appendChild(card);
  }
}

renderShinys();
renderMegas();
renderEspeciais();

/* BUSCA */
document.getElementById("search").addEventListener("input", e => {
  const v = e.target.value.toLowerCase();
  renderShinys(v);
  renderMegas(v);
  renderEspeciais(v);
});

/* TOGGLE */
function toggle(section) {
  shinyDiv.classList.add("hidden");
  megaDiv.classList.add("hidden");
  especiaisDiv.classList.add("hidden");
  document.getElementById(section).classList.remove("hidden");
}
</script>

</body>
</html>
