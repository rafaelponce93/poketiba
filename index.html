<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinys & Megas</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
}

button {
  display: block;
  margin: 15px auto;
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
}

.card img {
  width: 120px;
}

.name {
  font-weight: bold;
  margin-top: 5px;
}

.stat {
  font-size: 14px;
  margin-top: 6px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<h1>✨ Pokeclt – Shinys & Megas</h1>

<button onclick="toggle()">Shinys 🔁 Megas</button>

<div id="shinys" class="grid"></div>
<div id="megas" class="grid hidden"></div>

<script>
/* ======================
   👉 EDITE OS SHINYS 👈
   ====================== */
const SHINYS = {
  venusaur: 0,
  charizard: 1,
  blastoise: 0,
  butterfree: 0,
  beedrill: 0,
  pidgeot: 0,
  raticate: 0,
  fearow: 0,
  arbok: 0,
  raichu: 0,
  sandslash: 0,
  nidoqueen: 0,
  nidoking: 0,
  clefable: 0,
  ninetales: 0,
  wigglytuff: 0,
  golbat: 0,
  vileplume: 0,
  parasect: 0,
  venomoth: 0,
  dugtrio: 0,
  persian: 0,
  golduck: 0,
  primeape: 0,
  arcanine: 0,
  poliwrath: 0,
  alakazam: 0,
  machamp: 0,
  victreebel: 0,
  tentacruel: 0,
  golem: 0,
  rapidash: 0,
  slowbro: 0,
  magneton: 0,
  farfetchd: 0,
  dodrio: 0,
  dewgong: 0,
  muk: 0,
  cloyster: 0,
  gengar: 0,
  hypno: 0,
  kingler: 0,
  electrode: 0,
  exeggutor: 0,
  marowak: 0,
  hitmonlee: 0,
  hitmonchan: 0,
  weezing: 0,
  rhydon: 0,
  chansey: 0,
  tangela: 0,
  kangaskhan: 0,
  seadra: 0,
  seaking: 0,
  starmie: 0,
  "mr-mime": 0,
  scyther: 0,
  jynx: 0,
  electabuzz: 0,
  magmar: 0,
  pinsir: 0,
  tauros: 0,
  gyarados: 0,
  lapras: 0,
  ditto: 0,
  vaporeon: 0,
  jolteon: 0,
  flareon: 0,
  porygon: 0,
  omastar: 0,
  kabutops: 0,
  aerodactyl: 1,
  snorlax: 0,
  articuno: 0,
  zapdos: 0,
  moltres: 0,
  dragonite: 0,
  mewtwo: 0,
  mew: 0
};

/* ======================
   👉 EDITE OS MEGAS 👈
   ====================== */
const MEGAS = {
  "charizard-mega-x": { nome: "Charizard Mega X", player: "Rafael" },
  "alakazam-mega": { nome: "Mega Alakazam", player: "" },
  "gengar-mega": { nome: "Mega Gengar", player: "" },
  "gyarados-mega": { nome: "Mega Gyarados", player: "" },
  "kangaskhan-mega": { nome: "Mega Kangaskhan", player: "" },
  "pinsir-mega": { nome: "Mega Pinsir", player: "" },
  "pidgeot-mega": { nome: "Mega Pidgeot", player: "" },
  "aerodactyl-mega": { nome: "Mega Aerodactyl", player: "" },
  "venusaur-mega": { nome: "Mega Venusaur", player: "" },
  "blastoise-mega": { nome: "Mega Blastoise", player: "" },
  "beedrill-mega": { nome: "Mega Beedrill", player: "" }
};

/* ======================
   RENDER SHINYS
   ====================== */
const shinyDiv = document.getElementById("shinys");

for (const pkm in SHINYS) {
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = `https://play.pokemonshowdown.com/sprites/ani-shiny/${pkm}.gif`;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = pkm.replace("-", " ");

  const stat = document.createElement("div");
  stat.className = "stat";
  stat.textContent = `✨ Shinys capturados: ${SHINYS[pkm]}`;

  card.append(img, name, stat);
  shinyDiv.appendChild(card);
}

/* ======================
   RENDER MEGAS
   ====================== */
const megaDiv = document.getElementById("megas");

for (const mega in MEGAS) {
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = `https://play.pokemonshowdown.com/sprites/ani/${mega}.gif`;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = MEGAS[mega].nome;

  const player = document.createElement("div");
  player.className = "stat";
  player.textContent = `👤 Player: ${MEGAS[mega].player || "-"}`;

  card.append(img, name, player);
  megaDiv.appendChild(card);
}

/* ======================
   TOGGLE
   ====================== */
function toggle() {
  shinyDiv.classList.toggle("hidden");
  megaDiv.classList.toggle("hidden");
}
</script>

</body>
</html>
