<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinydex Kanto</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: linear-gradient(180deg, #f7f7f7, #ececec);
  margin: 0;
  padding: 16px;
}

h1 {
  text-align: center;
  margin-bottom: 16px;
}

#controls {
  text-align: center;
  margin-bottom: 20px;
}

button {
  padding: 10px 18px;
  margin: 6px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
  background: #ddd;
}

button.active {
  background: #222;
  color: #fff;
}

#pokemon-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
}

.pokemon-card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  text-align: center;
  box-shadow: 0 6px 15px rgba(0,0,0,0.12);
}

.pokemon-card img {
  width: 128px;
  height: 128px;
  image-rendering: pixelated;
}

.pokemon-name {
  font-weight: bold;
  text-transform: capitalize;
  font-size: 16px;
  margin-top: 8px;
}

.types {
  font-size: 13px;
  color: #666;
}

.stat {
  margin-top: 8px;
  font-size: 14px;
  font-weight: bold;
}

.player {
  margin-top: 6px;
  font-size: 13px;
}
</style>
</head>

<body>

<h1>✨ Pokeclt – Shinydex Kanto</h1>

<div id="controls">
  <button id="btnShiny" class="active">✨ Shinys</button>
  <button id="btnMega">🧬 Megas</button>
</div>

<div id="pokemon-container"></div>

/* ===== Sprites Mega ===== */
const MEGAS = {
  venusaur:"https://play.pokemonshowdown.com/sprites/xyani/venusaur-mega.gif",
  charizard:"https://play.pokemonshowdown.com/sprites/xyani/charizard-mega-x.gif",
  blastoise:"https://play.pokemonshowdown.com/sprites/xyani/blastoise-mega.gif",

  pidgeot:"https://play.pokemonshowdown.com/sprites/xyani/pidgeot-mega.gif",
  alakazam:"https://play.pokemonshowdown.com/sprites/xyani/alakazam-mega.gif",
  gengar:"https://play.pokemonshowdown.com/sprites/xyani/gengar-mega.gif",
  kangaskhan:"https://play.pokemonshowdown.com/sprites/xyani/kangaskhan-mega.gif",
  pinsir:"https://play.pokemonshowdown.com/sprites/xyani/pinsir-mega.gif",
  gyarados:"https://play.pokemonshowdown.com/sprites/xyani/gyarados-mega.gif",
  aerodactyl:"https://play.pokemonshowdown.com/sprites/xyani/aerodactyl-mega.gif"
};

const container=document.getElementById("pokemon-container");
const btnShiny=document.getElementById("btnShiny");
const btnMega=document.getElementById("btnMega");
let mode="shiny";

btnShiny.onclick=()=>switchMode("shiny");
btnMega.onclick=()=>switchMode("mega");

function switchMode(m){
  mode=m;
  btnShiny.classList.toggle("active",m==="shiny");
  btnMega.classList.toggle("active",m==="mega");
  render();
}

async function render(){
  container.innerHTML="";
  for(const name in DATA){
    if(mode==="mega"&&!MEGAS[name])continue;
    const api=await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`).then(r=>r.json());
    const img=mode==="mega"?MEGAS[name]:api.sprites.front_shiny;
    const card=document.createElement("div");
    card.className="pokemon-card";
    card.innerHTML=`
      <img src="${img}">
      <div class="pokemon-name">${api.name}</div>
      <div class="types">${api.types.map(t=>t.type.name).join(" / ")}</div>
      <div class="stat">${mode==="shiny"?"✨ Shinys":"🧬 Megas"}: ${DATA[name][mode]}</div>
      ${mode==="mega"&&DATA[name].player?`<div class="player">👤 ${DATA[name].player}</div>`:""}
    `;
    container.appendChild(card);
  }
}
render();
</script>
