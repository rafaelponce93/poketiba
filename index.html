<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Poketiba – Shinydex Kanto</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 20px;
}

h1 {
  text-align: center;
}

#pokemon-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 15px;
}

.pokemon-card {
  background: #fff;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,.1);
}

.pokemon-card img {
  width: 96px;
}

.name {
  font-weight: bold;
  text-transform: capitalize;
}

.stat {
  font-size: 13px;
  margin-top: 5px;
}
</style>
</head>

<body>

<h1>✨ Poketiba – Shinydex Kanto</h1>

<div id="pokemon-container"></div>

<script>
// ======================================
// 👉 EDITE OS SHINYS AQUI (VISÍVEL) 👈
// ======================================
const SHINYS = {
  bulbasaur: 0,
  ivysaur: 0,
  venusaur: 0,
  charmander: 0,
  charmeleon: 0,
  charizard: 1,
  squirtle: 0,
  wartortle: 0,
  blastoise: 0,
  caterpie: 0,
  metapod: 0,
  butterfree: 0,
  weedle: 0,
  kakuna: 0,
  beedrill: 0,
  pidgey: 0,
  pidgeotto: 0,
  pidgeot: 0,
  pikachu: 0,
  raichu: 0,
  zubat: 0,
  golbat: 0,
  abra: 0,
  kadabra: 0,
  alakazam: 0,
  gastly: 0,
  haunter: 0,
  gengar: 0,
  magikarp: 0,
  gyarados: 0,
  aerodactyl: 1,
  mewtwo: 0
};

// Pokémon com Mega
const MEGAS = [
  "charizard",
  "blastoise",
  "venusaur",
  "beedrill",
  "aerodactyl",
  "pidgeot",
  "alakazam",
  "gengar",
  "gyarados"
];

const container = document.getElementById("pokemon-container");

async function loadPokemon() {
  for (let i = 1; i <= 151; i++) {
    const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${i}`);
    const data = await res.json();

    const card = document.createElement("div");
    card.className = "pokemon-card";

    card.innerHTML = `
      <img src="${data.sprites.front_default}">
      <div class="name">${data.name}</div>
      <div class="stat">✨ Shinys capturados: ${SHINYS[data.name] ?? 0}</div>
      ${MEGAS.includes(data.name) ? `<div class="stat">🧬 Megas feitos</div>` : ""}
    `;

    container.appendChild(card);
  }
}

loadPokemon();
</script>

</body>
</html>
