/* ===== Sprites Mega (CORRETOS) ===== */
const MEGA_SPRITES = {
  venusaur: "https://play.pokemonshowdown.com/sprites/xyani/venusaur-mega.gif",
  charizard: "https://play.pokemonshowdown.com/sprites/xyani/charizard-mega-x.gif",

  aerodactyl: "https://play.pokemonshowdown.com/sprites/xyani/aerodactyl-mega.gif"
};

const container = document.getElementById("pokemon-container");
const topInfo = document.getElementById("top-info");
const btnShiny = document.getElementById("btn-shiny");
const btnMega = document.getElementById("btn-mega");

let mode = "shiny";

btnShiny.onclick = () => switchMode("shiny");
btnMega.onclick = () => switchMode("mega");

function switchMode(m) {
  mode = m;
  btnShiny.classList.toggle("active", mode === "shiny");
  btnMega.classList.toggle("active", mode === "mega");
  render();
}

async function render() {
  container.innerHTML = "";
  let total = 0;

  for (const name in POKEMON_DATA) {
    if (mode === "mega" && !MEGA_SPRITES[name]) continue;

    const api = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`).then(r => r.json());
    const value = POKEMON_DATA[name][mode] ?? 0;
    total += value;

    const img =
      mode === "mega"
        ? MEGA_SPRITES[name]
        : api.sprites.front_shiny; // 🔥 SHINY REAL

    const card = document.createElement("div");
    card.className = "pokemon-card";
    if (value > 0) card.classList.add("highlight");

    card.innerHTML = `
      <img src="${img}">
      <div class="pokemon-name">${api.name}</div>
      <div class="types">${api.types.map(t => t.type.name).join(" / ")}</div>
      <div class="stat">${mode === "shiny" ? "✨ Shinys" : "🧬 Megas"}: ${value}</div>
    `;

    container.appendChild(card);
  }

  topInfo.textContent =
    mode === "shiny"
      ? `✨ Total de Shinys: ${total}`
      : `🧬 Total de Megas: ${total}`;
}

render();
