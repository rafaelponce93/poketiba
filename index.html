<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinys, Megas & Especiais</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;
  flex-wrap: wrap;
}

button {
  padding: 16px 32px;
  font-size: 20px;
  cursor: pointer;
  border-radius: 12px;
  border: none;
  background: #ffcc00;
  font-weight: bold;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 14px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}

.card img {
  width: 150px;
}

.name {
  font-weight: bold;
  margin-top: 6px;
}

.stat {
  font-size: 14px;
  margin-top: 6px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<h1>✨ Pokeclt – Shinys, Megas & Especiais</h1>

<div class="buttons">
  <button onclick="showTab('shinys')">✨ Shinys</button>
  <button onclick="showTab('megas')">💥 Megas</button>
  <button onclick="showTab('special')">🔮 Especiais</button>
</div>

<div id="shinys" class="grid"></div>
<div id="megas" class="grid hidden"></div>
<div id="special" class="grid hidden"></div>

<script>
/* ========= SHINYS ========= */
const SHINYS = {
  charizard: 1,
  aerodactyl: 1,
  "mr-mime": 0
};

/* ========= MEGAS ========= */
const MEGAS = {
  charizardX: {
    nome: "Mega Charizard X",
    img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png",
    player: "Rafael"
  }
};

/* ========= ESPECIAIS ========= */
const SPECIALS = [
  {
    nome: "Crystal Onix",
    img: "https://archives.bulbagarden.net/media/upload/7/7b/Crystal_Onix.png"
  }
];

/* ========= RENDER SHINYS ========= */
const shinyDiv = document.getElementById("shinys");

for (const pkm in SHINYS) {
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = `https://play.pokemonshowdown.com/sprites/ani-shiny/${pkm}.gif`;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = pkm === "mr-mime" ? "Mr. Mime" : pkm;

  const stat = document.createElement("div");
  stat.className = "stat";
  stat.textContent = `✨ Shinys capturados: ${SHINYS[pkm]}`;

  card.append(img, name, stat);
  shinyDiv.appendChild(card);
}

/* ========= RENDER MEGAS ========= */
const megaDiv = document.getElementById("megas");

for (const m in MEGAS) {
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = MEGAS[m].img;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = MEGAS[m].nome;

  const player = document.createElement("div");
  player.className = "stat";
  player.textContent = `👤 Player: ${MEGAS[m].player}`;

  card.append(img, name, player);
  megaDiv.appendChild(card);
}

/* ========= RENDER ESPECIAIS ========= */
const specialDiv = document.getElementById("special");

SPECIALS.forEach(sp => {
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = sp.img;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = sp.nome;

  card.append(img, name);
  specialDiv.appendChild(card);
});

/* ========= TOGGLE ========= */
function showTab(tab) {
  shinys.classList.add("hidden");
  megas.classList.add("hidden");
  special.classList.add("hidden");
  document.getElementById(tab).classList.remove("hidden");
}
</script>

</body>
</html>
