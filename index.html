<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinys, Megas & Especiais</title>

<style>
:root {
  --accent: #facc15;
  --mega: #7c3aed;
  --especial: #06b6d4;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e5e7eb;
}

header {
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
  padding: 30px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 36px;
}

header p {
  margin-top: 6px;
  color: #cbd5f5;
}

.counters {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.counter {
  background: white;
  color: #111;
  padding: 10px 18px;
  border-radius: 20px;
  font-weight: bold;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin: 20px;
}

input {
  padding: 12px;
  font-size: 16px;
  border-radius: 20px;
  border: 1px solid #ccc;
}

.buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

button {
  padding: 14px 28px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: 30px;
  background: var(--accent);
  cursor: pointer;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 22px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 6px 15px rgba(0,0,0,.15);
}

.card img {
  width: 160px;
  image-rendering: pixelated;
}

.name {
  font-weight: bold;
  margin-top: 8px;
  font-size: 18px;
  text-transform: capitalize;
}

.stat {
  font-size: 14px;
  margin-top: 6px;
}

.shiny { border: 3px solid gold; }
.mega { border: 3px solid var(--mega); }
.especial { border: 3px solid var(--especial); }

/* NÃO ALTERA COR */
.crystal {
  filter: none;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>✨ Pokeclt</h1>
  <p>Shinys, Megas & Especiais</p>

  <div class="counters">
    <div class="counter" id="shinyCount"></div>
    <div class="counter" id="megaCount"></div>
    <div class="counter" id="especialCount"></div>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="🔍 Buscar Pokémon...">
  <div class="buttons">
    <button onclick="showShinys()">Shinys</button>
    <button onclick="showMegas()">Megas</button>
    <button onclick="showEspeciais()">Especiais</button>
  </div>
</div>

<div id="shinys" class="grid"></div>
<div id="megas" class="grid hidden"></div>
<div id="especiais" class="grid hidden"></div>

<script>
/* ===== SHINYS ===== */
const SHINYS = {
  venusaur: 0, charizard: 1, blastoise: 0, butterfree: 0, beedrill: 0,
  pidgeot: 0, raticate: 0, fearow: 0, arbok: 0, raichu: 0,
  sandslash: 0, nidoqueen: 0, nidoking: 0, clefable: 0,
  ninetales: 0, wigglytuff: 0, golbat: 0, vileplume: 0,
  parasect: 0, venomoth: 0, dugtrio: 0, persian: 0,
  golduck: 0, primeape: 0, arcanine: 0, poliwrath: 0,
  alakazam: 0, machamp: 0, victreebel: 0, tentacruel: 0,
  golem: 0, rapidash: 0, slowbro: 0, magneton: 0,
  farfetchd: 0, dodrio: 0, dewgong: 0, muk: 0,
  cloyster: 0, gengar: 0, hypno: 0, kingler: 0,
  electrode: 0, exeggutor: 0, marowak: 0, hitmonlee: 0,
  hitmonchan: 0, weezing: 0, rhydon: 0, chansey: 0,
  tangela: 0, kangaskhan: 0, seadra: 0, seaking: 0,
  starmie: 0, mrmime: 0, scyther: 0, jynx: 0,
  electabuzz: 0, magmar: 0, pinsir: 0, tauros: 0,
  gyarados: 0, lapras: 0, ditto: 0, vaporeon: 0,
  jolteon: 0, flareon: 0, porygon: 0, omastar: 0,
  kabutops: 0, aerodactyl: 1, snorlax: 0,
  articuno: 0, zapdos: 0, moltres: 0,
  dragonite: 0, mewtwo: 0, mew: 0
};

/* ===== MEGAS ===== */
const MEGAS = {
  "charizard-megax": { nome: "Mega Charizard X", player: "Rafael" },
  "alakazam-mega": { nome: "Mega Alakazam", player: "" },
  "gengar-mega": { nome: "Mega Gengar", player: "" },
  "gyarados-mega": { nome: "Mega Gyarados", player: "" },
  "kangaskhan-mega": { nome: "Mega Kangaskhan", player: "" },
  "pinsir-mega": { nome: "Mega Pinsir", player: "" },
  "pidgeot-mega": { nome: "Mega Pidgeot", player: "" },
  "aerodactyl-mega": { nome: "Mega Aerodactyl", player: "" },
  "venusaur-mega": { nome: "Mega Venusaur", player: "" },
  "blastoise-mega": { nome: "Mega Blastoise", player: "" },
  "beedrill-mega": { nome: "Mega Beedrill", player: "" }
};

/* ===== ESPECIAIS ===== */
const ESPECIAIS = {
  crystalonix: {
    nome: "Crystal Ônix",
    img: "https://play.pokemonshowdown.com/sprites/ani/onix.gif"
  }
};

/* CONTADORES */
shinyCount.textContent =
  `✨ Shinys: ${Object.values(SHINYS).filter(v=>v>0).length} / ${Object.keys(SHINYS).length}`;
megaCount.textContent =
  `🧬 Megas: ${Object.keys(MEGAS).length}`;
especialCount.textContent =
  `💎 Especiais: ${Object.keys(ESPECIAIS).length}`;

/* RENDER */
function renderShinys(f="") {
  shinys.innerHTML = "";
  for (const p in SHINYS) {
    if (!p.includes(f)) continue;
    shinys.innerHTML += `
      <div class="card ${SHINYS[p]>0?'shiny':''}">
        <img src="https://play.pokemonshowdown.com/sprites/ani-shiny/${p}.gif">
        <div class="name">${p}</div>
        <div class="stat">✨ Shinys capturados: ${SHINYS[p]}</div>
      </div>`;
  }
}

function renderMegas(f="") {
  megas.innerHTML = "";
  for (const m in MEGAS) {
    if (!MEGAS[m].nome.toLowerCase().includes(f)) continue;
    megas.innerHTML += `
      <div class="card mega">
        <img src="https://play.pokemonshowdown.com/sprites/ani/${m}.gif">
        <div class="name">${MEGAS[m].nome}</div>
        <div class="stat">👤 Player: ${MEGAS[m].player || "-"}</div>
      </div>`;
  }
}

function renderEspeciais() {
  especiais.innerHTML = "";
  for (const e in ESPECIAIS) {
    especiais.innerHTML += `
      <div class="card especial">
        <img class="crystal" src="${ESPECIAIS[e].img}">
        <div class="name">${ESPECIAIS[e].nome}</div>
        <div class="stat">💎 Especial</div>
      </div>`;
  }
}

renderShinys();
renderMegas();
renderEspeciais();

/* BUSCA */
search.oninput = e => {
  const v = e.target.value.toLowerCase();
  renderShinys(v);
  renderMegas(v);
};

/* BOTÕES */
function showShinys(){shinys.classList.remove("hidden");megas.classList.add("hidden");especiais.classList.add("hidden")}
function showMegas(){shinys.classList.add("hidden");megas.classList.remove("hidden");especiais.classList.add("hidden")}
function showEspeciais(){shinys.classList.add("hidden");megas.classList.add("hidden");especiais.classList.remove("hidden")}
</script>

</body>
</html>
