<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinys & Megas</title>

<style>
:root {
  --accent: #facc15;
  --mega: #7c3aed;
  --special: #0ea5e9;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e5e7eb;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
  padding: 30px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 36px;
}

header p {
  margin-top: 6px;
  color: #cbd5f5;
}

/* CONTADORES */
.counters {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.counter {
  background: white;
  color: #111;
  padding: 10px 18px;
  border-radius: 20px;
  font-weight: bold;
}

/* CONTROLES */
.controls {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin: 20px;
}

input {
  padding: 12px;
  font-size: 16px;
  border-radius: 20px;
  border: 1px solid #ccc;
}

button {
  padding: 16px 40px;
  font-size: 20px;
  font-weight: bold;
  border: none;
  border-radius: 40px;
  background: var(--accent);
  cursor: pointer;
}

button.special {
  background: var(--special);
  color: white;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 22px;
  padding: 20px;
}

/* CARD */
.card {
  background: white;
  border-radius: 18px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 6px 15px rgba(0,0,0,.15);
}

.card img {
  width: 160px;
  image-rendering: pixelated;
}

.name {
  font-weight: bold;
  margin-top: 8px;
  font-size: 18px;
  text-transform: capitalize;
}

.stat {
  font-size: 14px;
  margin-top: 6px;
}

.shiny {
  border: 3px solid gold;
}

.mega {
  border: 3px solid var(--mega);
}

.specialCard {
  border: 3px solid var(--special);
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>✨ Pokeclt</h1>
  <p>Shinys & Megas — Atualização Oficial</p>

  <div class="counters">
    <div class="counter" id="shinyCount"></div>
    <div class="counter" id="megaCount"></div>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="🔍 Buscar Pokémon...">
  <button onclick="toggle()">Shinys 🔁 Megas</button>
  <button class="special" onclick="showSpecials()">✨ Especiais</button>
</div>

<div id="shinys" class="grid"></div>
<div id="megas" class="grid hidden"></div>
<div id="specials" class="grid hidden"></div>

<script>
/* ===== SHINYS (INALTERADO) ===== */
const SHINYS = {
  venusaur: 0, charizard: 1, blastoise: 0, butterfree: 0, beedrill: 0,
  pidgeot: 0, raticate: 0, fearow: 0, arbok: 0, raichu: 0,
  sandslash: 0, nidoqueen: 0, nidoking: 0, clefable: 0,
  ninetales: 0, wigglytuff: 0, golbat: 0, vileplume: 0,
  parasect: 0, venomoth: 0, dugtrio: 0, persian: 0,
  golduck: 0, primeape: 0, arcanine: 0, poliwrath: 0,
  alakazam: 0, machamp: 0, victreebel: 0, tentacruel: 0,
  golem: 0, rapidash: 0, slowbro: 0, magneton: 0,
  farfetchd: 0, dodrio: 0, dewgong: 0, muk: 0,
  cloyster: 0, gengar: 0, hypno: 0, kingler: 0,
  electrode: 0, exeggutor: 0, marowak: 0, hitmonlee: 0,
  hitmonchan: 0, weezing: 0, rhydon: 0, chansey: 0,
  tangela: 0, kangaskhan: 0, seadra: 0, seaking: 0,
  starmie: 0, mr-mime: 0, scyther: 0, jynx: 0,
  electabuzz: 0, magmar: 0, pinsir: 0, tauros: 0,
  gyarados: 0, lapras: 0, ditto: 0, vaporeon: 0,
  jolteon: 0, flareon: 0, porygon: 0, omastar: 0,
  kabutops: 0, aerodactyl: 1, snorlax: 0,
  articuno: 0, zapdos: 0, moltres: 0,
  dragonite: 0, mewtwo: 0, mew: 0
};

/* ===== MEGAS (INALTERADO) ===== */
const MEGAS = {
  "charizard-megax": { nome: "Mega Charizard X", player: "Rafael" },
  "alakazam-mega": { nome: "Mega Alakazam", player: "" },
  "gengar-mega": { nome: "Mega Gengar", player: "" },
  "gyarados-mega": { nome: "Mega Gyarados", player: "" },
  "kangaskhan-mega": { nome: "Mega Kangaskhan", player: "" },
  "pinsir-mega": { nome: "Mega Pinsir", player: "" },
  "pidgeot-mega": { nome: "Mega Pidgeot", player: "" },
  "aerodactyl-mega": { nome: "Mega Aerodactyl", player: "" },
  "venusaur-mega": { nome: "Mega Venusaur", player: "" },
  "blastoise-mega": { nome: "Mega Blastoise", player: "" },
  "beedrill-mega": { nome: "Mega Beedrill", player: "" }
};

/* ===== ESPECIAIS (NOVO – NÃO ALTERA NADA EXISTENTE) ===== */
const ESPECIAIS = {
  crystalOnix: {
    nome: "Crystal Onix",
    player: ""
  }
};

/* CONTADORES */
document.getElementById("shinyCount").textContent =
  `✨ Shinys: ${Object.values(SHINYS).filter(v => v > 0).length} / ${Object.keys(SHINYS).length}`;

document.getElementById("megaCount").textContent =
  `🧬 Megas: ${Object.keys(MEGAS).length}`;

/* RENDER SHINYS */
const shinyDiv = document.getElementById("shinys");
const megaDiv = document.getElementById("megas");
const specialDiv = document.getElementById("specials");

function renderShinys() {
  shinyDiv.innerHTML = "";
  for (const pkm in SHINYS) {
    const card = document.createElement("div");
    card.className = "card";
    if (SHINYS[pkm] > 0) card.classList.add("shiny");

    card.innerHTML = `
      <img src="https://play.pokemonshowdown.com/sprites/ani-shiny/${pkm}.gif">
      <div class="name">${pkm}</div>
      <div class="stat">✨ Shinys capturados: ${SHINYS[pkm]}</div>
    `;
    shinyDiv.appendChild(card);
  }
}

/* RENDER MEGAS */
function renderMegas() {
  megaDiv.innerHTML = "";
  for (const m in MEGAS) {
    const card = document.createElement("div");
    card.className = "card mega";

    card.innerHTML = `
      <img src="https://play.pokemonshowdown.com/sprites/ani/${m}.gif">
      <div class="name">${MEGAS[m].nome}</div>
      <div class="stat">👤 Player: ${MEGAS[m].player || "-"}</div>
    `;
    megaDiv.appendChild(card);
  }
}

/* RENDER ESPECIAIS */
function renderSpecials() {
  specialDiv.innerHTML = "";

  const card = document.createElement("div");
  card.className = "card specialCard";

  /* SVG próprio do Crystal Onix */
  card.innerHTML = `
    <img src="data:image/svg+xml;utf8,
    <svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'>
      <rect width='100%' height='100%' fill='%230ea5e9'/>
      <text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle'
        font-size='18' fill='white' font-family='Arial'>CRYSTAL ONIX</text>
    </svg>">
    <div class="name">Crystal Onix</div>
    <div class="stat">👤 Player: ${ESPECIAIS.crystalOnix.player || "-"}</div>
  `;
  specialDiv.appendChild(card);
}

/* TOGGLES */
function toggle() {
  shinyDiv.classList.toggle("hidden");
  megaDiv.classList.toggle("hidden");
  specialDiv.classList.add("hidden");
}

function showSpecials() {
  shinyDiv.classList.add("hidden");
  megaDiv.classList.add("hidden");
  specialDiv.classList.remove("hidden");
}

renderShinys();
renderMegas();
renderSpecials();
</script>

</body>
</html>
