<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinys, Megas & Especiais</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
}

button {
  display: block;
  margin: 20px auto;
  padding: 14px 30px;
  font-size: 18px;
  cursor: pointer;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
}

.card img {
  width: 120px;
}

.name {
  font-weight: bold;
  margin-top: 5px;
  text-transform: capitalize;
}

.stat {
  font-size: 14px;
  margin-top: 6px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<h1>✨ Pokeclt – Shinys, Megas & Especiais</h1>

<button onclick="toggle()">Shinys 🔁 Megas 🔁 Especiais</button>

<div id="shinys" class="grid"></div>
<div id="megas" class="grid hidden"></div>
<div id="especiais" class="grid hidden"></div>

<script>
let view = 0;

/* ======================
   👉 SHINYS (EDITÁVEL) 👈
   ====================== */
const SHINYS = {
  venusaur: 0,
  charizard: 1,
  blastoise: 0,
  butterfree: 0,
  beedrill: 0,
  pidgeot: 0,
  raichu: 0,
  sandslash: 0,
  nidoqueen: 0,
  nidoking: 0,
  clefable: 0,
  ninetales: 0,
  wigglytuff: 0,
  vileplume: 0,
  dugtrio: 0,
  persian: 0,
  golduck: 0,
  primeape: 0,
  arcanine: 0,
  poliwrath: 0,
  alakazam: 0,
  machamp: 0,
  victreebel: 0,
  tentacruel: 0,
  golem: 0,
  rapidash: 0,
  slowbro: 0,
  magneton: 0,
  dodrio: 0,
  dewgong: 0,
  muk: 0,
  cloyster: 0,
  gengar: 0,
  hypno: 0,
  kingler: 0,
  electrode: 0,
  exeggutor: 0,
  marowak: 0,
  weezing: 0,
  rhydon: 0,
  chansey: 0,
  tangela: 0,
  kangaskhan: 0,
  seadra: 0,
  seaking: 0,
  starmie: 0,
  "mr-mime": 0,
  scyther: 0,
  jynx: 0,
  electabuzz: 0,
  magmar: 0,
  pinsir: 0,
  tauros: 0,
  gyarados: 0,
  lapras: 0,
  ditto: 0,
  vaporeon: 0,
  jolteon: 0,
  flareon: 0,
  porygon: 0,
  omastar: 0,
  kabutops: 0,
  aerodactyl: 1,
  snorlax: 0,
  articuno: 0,
  zapdos: 0,
  moltres: 0,
  dragonite: 0,
  mewtwo: 0,
  mew: 0
};

/* ======================
   👉 MEGAS 👈
   ====================== */
const MEGAS = {
  "charizard-mega-x": { nome: "Mega Charizard X", player: "Rafael" },
  "alakazam-mega": { nome: "Mega Alakazam", player: "" },
  "gengar-mega": { nome: "Mega Gengar", player: "" },
  "gyarados-mega": { nome: "Mega Gyarados", player: "" },
  "kangaskhan-mega": { nome: "Mega Kangaskhan", player: "" },
  "pinsir-mega": { nome: "Mega Pinsir", player: "" },
  "pidgeot-mega": { nome: "Mega Pidgeot", player: "" },
  "aerodactyl-mega": { nome: "Mega Aerodactyl", player: "" },
  "venusaur-mega": { nome: "Mega Venusaur", player: "" },
  "blastoise-mega": { nome: "Mega Blastoise", player: "" },
  "beedrill-mega": { nome: "Mega Beedrill", player: "" }
};

/* ======================
   👉 ESPECIAIS 👈
   ====================== */
const ESPECIAIS = [
  {
    nome: "Crystal Onix",
    img: "https://archives.bulbagarden.net/media/upload/7/7b/Crystal_Onix.png",
    descricao: "Onix especial feito de cristal"
  }
];

/* ======================
   RENDER SHINYS
   ====================== */
const shinyDiv = document.getElementById("shinys");
for (const pkm in SHINYS) {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="https://play.pokemonshowdown.com/sprites/ani-shiny/${pkm}.gif">
    <div class="name">${pkm.replace("-", " ")}</div>
    <div class="stat">✨ Shinys capturados: ${SHINYS[pkm]}</div>
  `;
  shinyDiv.appendChild(card);
}

/* ======================
   RENDER MEGAS
   ====================== */
const megaDiv = document.getElementById("megas");
for (const mega in MEGAS) {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="https://play.pokemonshowdown.com/sprites/ani/${mega}.gif">
    <div class="name">${MEGAS[mega].nome}</div>
    <div class="stat">👤 Player: ${MEGAS[mega].player || "-"}</div>
  `;
  megaDiv.appendChild(card);
}

/* ======================
   RENDER ESPECIAIS
   ====================== */
const especiaisDiv = document.getElementById("especiais");
ESPECIAIS.forEach(p => {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="${p.img}">
    <div class="name">${p.nome}</div>
    <div class="stat">${p.descricao}</div>
  `;
  especiaisDiv.appendChild(card);
});

/* ======================
   TOGGLE
   ====================== */
function toggle() {
  view = (view + 1) % 3;
  shinyDiv.classList.toggle("hidden", view !== 0);
  megaDiv.classList.toggle("hidden", view !== 1);
  especiaisDiv.classList.toggle("hidden", view !== 2);
}
</script>

</body>
</html>
