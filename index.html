<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pokeclt – Shinys, Megas & Especiais</title>

<style>
:root {
  --accent: #facc15;
  --mega: #7c3aed;
  --crystal: #2563eb; /* azul forte */
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e5e7eb;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
  padding: 30px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 36px;
}

header p {
  margin-top: 6px;
  color: #cbd5f5;
}

/* CONTADORES */
.counters {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.counter {
  background: white;
  color: #111;
  padding: 10px 18px;
  border-radius: 20px;
  font-weight: bold;
}

/* CONTROLES */
.controls {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin: 20px;
}

input {
  padding: 12px;
  font-size: 16px;
  border-radius: 20px;
  border: 1px solid #ccc;
}

button {
  padding: 16px 40px;
  font-size: 20px;
  font-weight: bold;
  border: none;
  border-radius: 40px;
  background: var(--accent);
  cursor: pointer;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 22px;
  padding: 20px;
}

/* CARD */
.card {
  background: white;
  border-radius: 18px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 6px 15px rgba(0,0,0,.15);
  position: relative;
}

.card img {
  width: 160px;
  image-rendering: pixelated;
}

.name {
  font-weight: bold;
  margin-top: 8px;
  font-size: 18px;
  text-transform: capitalize;
}

.stat {
  font-size: 14px;
  margin-top: 6px;
}

.shiny {
  border: 3px solid gold;
}

.mega {
  border: 3px solid var(--mega);
}

/* ===== CRYSTAL AZUL ===== */
.crystal-card {
  border: 3px solid var(--crystal);
  background: linear-gradient(145deg, #dbeafe, #bfdbfe);
  box-shadow:
    0 0 25px rgba(37,99,235,.9),
    inset 0 0 12px rgba(255,255,255,.8);
}

.crystal {
  filter:
    grayscale(1)
    brightness(1.3)
    contrast(1.15)
    drop-shadow(0 0 12px rgba(37,99,235,1));
}

/* brilho animado */
.crystal-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 18px;
  background: linear-gradient(
    120deg,
    transparent 25%,
    rgba(255,255,255,.7) 45%,
    transparent 65%
  );
  animation: shine 3s infinite;
  pointer-events: none;
}

@keyframes shine {
  from { transform: translateX(-120%); }
  to { transform: translateX(120%); }
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>✨ Pokeclt</h1>
  <p>Shinys, Megas & Especiais — Atualização Oficial</p>

  <div class="counters">
    <div class="counter" id="shinyCount"></div>
    <div class="counter" id="megaCount"></div>
    <div class="counter" id="specialCount"></div>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="🔍 Buscar Pokémon...">
  <button onclick="toggle()">Shinys 🔁 Megas 🔁 Especiais</button>
</div>

<div id="shinys" class="grid"></div>
<div id="megas" class="grid hidden"></div>
<div id="especiais" class="grid hidden"></div>

<script>
/* ===== SHINYS ===== */
const SHINYS = {
  venusaur: 0, charizard: 1, blastoise: 0, butterfree: 0, beedrill: 0,
  pidgeot: 0, raticate: 0, fearow: 0, arbok: 0, raichu: 0,
  sandslash: 0, nidoqueen: 0, nidoking: 0, clefable: 0,
  ninetales: 0, wigglytuff: 0, golbat: 0, vileplume: 0,
  parasect: 0, venomoth: 0, dugtrio: 0, persian: 0,
  golduck: 0, primeape: 0, arcanine: 0, poliwrath: 0,
  alakazam: 0, machamp: 0, victreebel: 0, tentacruel: 0,
  golem: 0, rapidash: 0, slowbro: 0, magneton: 0,
  farfetchd: 0, dodrio: 0, dewgong: 0, muk: 0,
  cloyster: 0, gengar: 0, hypno: 0, kingler: 0,
  electrode: 0, exeggutor: 0, marowak: 0, hitmonlee: 0,
  hitmonchan: 0, weezing: 0, rhydon: 0, chansey: 0,
  tangela: 0, kangaskhan: 0, seadra: 0, seaking: 0,
  starmie: 0, mrmime: 0, scyther: 0, jynx: 0,
  electabuzz: 0, magmar: 0, pinsir: 0, tauros: 0,
  gyarados: 0, lapras: 0, ditto: 0, vaporeon: 0,
  jolteon: 0, flareon: 0, porygon: 0, omastar: 0,
  kabutops: 0, aerodactyl: 1, snorlax: 0,
  articuno: 0, zapdos: 0, moltres: 0,
  dragonite: 0, mewtwo: 0, mew: 0
};

/* ===== MEGAS ===== */
const MEGAS = {
  "charizard-megax": { nome: "Mega Charizard X", player: "Rafael" }
};

/* ===== ESPECIAIS ===== */
const ESPECIAIS = {
  crystalonix: {
    nome: "Crystal Ônix",
    img: "https://play.pokemonshowdown.com/sprites/ani/onix.gif",
    player: "Rafael"
  }
};

/* CONTADORES */
document.getElementById("shinyCount").textContent =
  `✨ Shinys: ${Object.values(SHINYS).filter(v => v > 0).length} / ${Object.keys(SHINYS).length}`;

document.getElementById("megaCount").textContent =
  `🧬 Megas: ${Object.keys(MEGAS).length}`;

document.getElementById("specialCount").textContent =
  `💎 Especiais: ${Object.keys(ESPECIAIS).length}`;

/* DIVS */
const shinyDiv = document.getElementById("shinys");
const megaDiv = document.getElementById("megas");
const especiaisDiv = document.getElementById("especiais");

/* RENDER */
function renderShinys(f="") {
  shinyDiv.innerHTML = "";
  for (const p in SHINYS) {
    if (!p.includes(f)) continue;
    const c = document.createElement("div");
    c.className = "card" + (SHINYS[p] > 0 ? " shiny" : "");
    c.innerHTML = `
      <img src="https://play.pokemonshowdown.com/sprites/ani-shiny/${p}.gif">
      <div class="name">${p}</div>
      <div class="stat">✨ Shinys capturados: ${SHINYS[p]}</div>`;
    shinyDiv.appendChild(c);
  }
}

function renderMegas() {
  megaDiv.innerHTML = "";
  for (const m in MEGAS) {
    const c = document.createElement("div");
    c.className = "card mega";
    c.innerHTML = `
      <img src="https://play.pokemonshowdown.com/sprites/ani/${m}.gif">
      <div class="name">${MEGAS[m].nome}</div>
      <div class="stat">👤 Player: ${MEGAS[m].player}</div>`;
    megaDiv.appendChild(c);
  }
}

function renderEspeciais() {
  especiaisDiv.innerHTML = "";
  for (const e in ESPECIAIS) {
    const c = document.createElement("div");
    c.className = "card crystal-card";
    c.innerHTML = `
      <img class="crystal" src="${ESPECIAIS[e].img}">
      <div class="name">${ESPECIAIS[e].nome}</div>
      <div class="stat">👤 Player: ${ESPECIAIS[e].player}</div>`;
    especiaisDiv.appendChild(c);
  }
}

renderShinys();
renderMegas();
renderEspeciais();

/* TOGGLE */
let mode = 0;
function toggle() {
  mode = (mode + 1) % 3;
  shinyDiv.classList.toggle("hidden", mode !== 0);
  megaDiv.classList.toggle("hidden", mode !== 1);
  especiaisDiv.classList.toggle("hidden", mode !== 2);
}
</script>

</body>
</html>
